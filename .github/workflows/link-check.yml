name: Catalog link check

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: actuator-research

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: actuator-research/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check datasheet links
        run: python scripts/check_links.py --report link-report.md
      - name: Publish report
        if: always()
        run: cat link-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-report
          path: actuator-research/link-report.md
